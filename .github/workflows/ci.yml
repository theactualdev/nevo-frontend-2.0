name: CI

# The repo had no CI at all until now, which is why a lint error sat on `main`
# for a day and a contract mismatch reached production twice. Three checks,
# fast, on every push and PR.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A new push supersedes the run in flight for the same ref - three sessions
  # push to this repo, and queued duplicate runs help nobody.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: types and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint

  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Needs no network: the node project is pure logic and the dom project
      # stubs its own transport. Unlike the contract job, this stays green
      # when the backend is down.
      - run: npm test

  e2e:
    name: end-to-end
    runs-on: ubuntu-latest
    # ONE AT A TIME, ACROSS EVERY BRANCH. The E2E tenant is a shared resource:
    # the student suite resets a probe child's PIN on every run, and each
    # signed-in suite's login REPLACES the account's previous session. Two runs
    # at once - two open PRs, say - would reset the PIN under each other and
    # kill each other's sessions mid-walk, which reads exactly like a product
    # bug and is not one. Queued, not cancelled: every run still reports.
    concurrency:
      group: e2e-tenant
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Chromium only, as the config explains.
      - run: npx playwright install --with-deps chromium
      # The signed-in specs SKIP when these are unset, so a fork without access
      # to the secrets still gets a green, meaningful run of everything else
      # rather than a red one for a sign-in it was never going to reach.
      #
      # THAT SKIP HID THAT NONE OF THEM HAD EVER RUN HERE. Until 25 Sep this job
      # reported "15 skipped" on every green run: neither the teacher secrets nor
      # the admin ones existed, so every signed-in suite skipped and the gate
      # was the signed-out suite alone. A skipped suite is not a passing one.
      #
      # All three accounts are on the dedicated E2E school (NEVO-E2E) - an
      # isolated tenant holding no real children.
      - run: npm run e2e
        env:
          E2E_TEACHER_EMAIL: ${{ secrets.E2E_TEACHER_EMAIL }}
          E2E_TEACHER_PASSWORD: ${{ secrets.E2E_TEACHER_PASSWORD }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          # Not secrets. The student suite MINTS its own PIN through the admin
          # above, so the only thing it needs is which probe child to use - and
          # every run RESETS that child's PIN, which is why it is named here in
          # the open rather than defaulted inside the spec.
          E2E_STUDENT_LOGIN: NV-E2E000
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  contract:
    name: contract against the deployed spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Needs no network, and runs in the contract job because it asks the same
      # question: is this client still the thing the architecture describes?
      #
      # GATING NOW, as `--warn` always said it would. The three findings it was
      # waiting on are closed: `useSignals`' two wall-clock stamps are gone,
      # SessionPanel's pronoun tooltip is gone, and NotificationsPanel's
      # `empty` is an allowlist entry whose reason prints on every run.
      # `npm run architecture` exits 0 on `main` as of 23 Sep.
      #
      # If this turns your merge red for something you did not write, say so
      # rather than restoring the flag - a gate that goes back to warning is
      # exactly the failure the comment here used to describe.
      - run: npm run architecture
      # Reaches the live API to fetch its OpenAPI document, so it fails when
      # the backend is down as well as when we disagree with it. That is
      # deliberate for now - a silent skip would let real drift through - but
      # if backend downtime starts blocking merges, make this job
      # `continue-on-error: true` rather than deleting it.
      - run: npm run contract
